name: docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: List the GIFs' LFS objects
        run: git lfs ls-files --long --include "docs/gifs/**" > .gifs-lfs
      - uses: actions/cache@v4
        with:
          path: .git/lfs/objects
          key: docs-gifs-${{ hashFiles('.gifs-lfs') }}
      - name: Fetch the GIFs
        run: git lfs pull --include "docs/gifs/**" --exclude ""
      - uses: astral-sh/setup-uv@v6
      - name: Build
        env:
          JAX_PLATFORMS: cpu
        run: >
          uv run --extra playground --with pdoc python docs/build.py --out site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
